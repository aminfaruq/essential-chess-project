name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: macos-14
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
    
    - name: Show Xcode version
      run: xcodebuild -version
    
    - name: List available simulators
      run: xcrun simctl list devices available
    
    - name: Cache derived data
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-derived-data-${{ hashFiles('**/*.xcodeproj/project.pbxproj') }}
        restore-keys: |
          ${{ runner.os }}-derived-data-
    
    - name: Run ChessBoard Tests
      run: |
        xcodebuild test \
          -project ChessBoard/ChessBoard.xcodeproj \
          -scheme ChessBoard \
          -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=17.5' \
          -testPlan ChessBoard.xctestplan \
          -enableCodeCoverage YES \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          | xcpretty && exit ${PIPESTATUS[0]}
    
    - name: Run EssentialChess Tests
      run: |
        xcodebuild test \
          -project EssentialChess/EssentialChess.xcodeproj \
          -scheme EssentialChess \
          -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=17.5' \
          -testPlan EssentialChess.xctestplan \
          -enableCodeCoverage YES \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          | xcpretty && exit ${PIPESTATUS[0]}
    
    - name: Run EssentialChessUI Tests
      run: |
        xcodebuild test \
          -project EssentialChess/EssentialChess.xcodeproj \
          -scheme EssentialChessUI \
          -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=17.5' \
          -testPlan EssentialChessUI.xctestplan \
          -enableCodeCoverage YES \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          | xcpretty && exit ${PIPESTATUS[0]}
    
    - name: Run EssentialChessApp Tests
      run: |
        xcodebuild test \
          -workspace EssentialChessApp/EssentialChessApp.xcworkspace \
          -scheme EssentialChessApp \
          -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=17.5' \
          -enableCodeCoverage YES \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          | xcpretty && exit ${PIPESTATUS[0]}

  build:
    name: Build App
    runs-on: macos-14
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
    
    - name: Cache derived data
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-derived-data-${{ hashFiles('**/*.xcodeproj/project.pbxproj') }}
        restore-keys: |
          ${{ runner.os }}-derived-data-
    
    - name: Build EssentialChessApp
      run: |
        xcodebuild build \
          -workspace EssentialChessApp/EssentialChessApp.xcworkspace \
          -scheme EssentialChessApp \
          -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=17.5' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          | xcpretty && exit ${PIPESTATUS[0]}
